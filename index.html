<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush Singh - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        .toggle-button {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            background: rgba(0, 0, 0, 0.05);
            color: #666;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 9999;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-button:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(1.1);
        }

        .toggle-button.netrunner-mode {
            background: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border-color: rgba(255, 0, 60, 0.2);
        }

        .toggle-button.netrunner-mode:hover {
            background: rgba(255, 0, 60, 0.15);
        }

        @media (max-width: 768px) {
            .toggle-button {
                bottom: 1rem;
                left: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <iframe id="genericFrame" src="Generic Version/index.html" class="active"></iframe>
    <iframe id="coolFrame" src="Cool Mode/index.html"></iframe>

    <script>
        let currentMode = 'generic';

        function toggleVersion() {
            const coolFrame = document.getElementById('coolFrame');
            const genericFrame = document.getElementById('genericFrame');

            if (currentMode === 'generic') {
                // Switch to Cool Mode - reload to trigger boot animation
                const coolSrc = coolFrame.src;
                coolFrame.src = '';
                setTimeout(() => {
                    coolFrame.src = coolSrc;
                    coolFrame.classList.add('active');
                    genericFrame.classList.remove('active');
                    currentMode = 'cool';
                    localStorage.setItem('preferredVersion', currentMode);
                }, 50);
            } else {
                // Switch to Generic Mode
                genericFrame.classList.add('active');
                coolFrame.classList.remove('active');
                currentMode = 'generic';
                localStorage.setItem('preferredVersion', currentMode);
            }
        }

        // Auto-load preferred version if exists
        window.addEventListener('DOMContentLoaded', () => {
            const preferred = localStorage.getItem('preferredVersion');
            if (preferred === 'cool') {
                toggleVersion();
            }
        });

        // Listen for messages from iframes
        window.addEventListener('message', (event) => {
            if (event.data === 'switchToGeneric' && currentMode === 'cool') {
                toggleVersion();
            } else if (event.data === 'switchToCool' && currentMode === 'generic') {
                toggleVersion();
            }
        });
    </script>
</body>

</html>
